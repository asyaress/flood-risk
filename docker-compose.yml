services:
  mysql:
    image: mysql:8.0
    container_name: flood_risk_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flood_risk
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: flood_risk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
